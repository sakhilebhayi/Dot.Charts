name: Maintenance — Test Accounts

# Production account maintenance for QA/smoke-test fixtures, over the same
# SSH channel as deploy:
#   find  — read-only: lists accounts whose email contains the input
#   purge — permanently deletes one account and everything it owns via
#           `php artisan user:purge` (which refuses platform operators)
# The confirm input must repeat the chosen action, mirroring the
# deploy/setup confirm gates.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options: [find, purge]
      confirm:
        description: 'Type the action again ("find" or "purge") to confirm'
        required: true
      email:
        description: 'purge: exact email to delete · find: email substring to search'
        required: true

concurrency:
  group: charts-production-deploy
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != github.event.inputs.action }}
        run: |
          echo '::error::Confirmation input did not repeat the action -- aborting.'
          exit 1

      - name: Refuse suspicious input
        env:
          ACTION: ${{ github.event.inputs.action }}
          PURGE_EMAIL: ${{ github.event.inputs.email }}
        run: |
          # The value is interpolated into a remote shell command below, so
          # hold it to a strict shape first (also catches typos/paste junk).
          # find takes a substring; purge requires a full plain email.
          if [ "$ACTION" = "purge" ]; then
            PATTERN='^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+$'
          else
            PATTERN='^[A-Za-z0-9._+@-]+$'
          fi
          if ! printf '%s' "$PURGE_EMAIL" | grep -Eq "$PATTERN"; then
            echo '::error::Input does not look like a plain email/substring -- aborting.'
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run the maintenance action
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              ACTION="${{ github.event.inputs.action }}" \
              PURGE_EMAIL="${{ github.event.inputs.email }}" \
              'bash -s' <<'MAINT'
          set -euo pipefail
          cd "$DEPLOY_PATH/backend"
          if [ "$ACTION" = "purge" ]; then
            php artisan user:purge "$PURGE_EMAIL" --force --no-interaction
          else
            php artisan user:find "$PURGE_EMAIL" --no-interaction
          fi
          MAINT
