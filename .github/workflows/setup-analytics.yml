name: Setup Analytics Service

# Provisions the Python FastAPI analytics service on the shared host:
# CloudLinux Python 3.11 venv at <repo>/analytics/.venv, dependencies from
# requirements.txt, a run script, and a keepalive cron (every 5 minutes +
# @reboot) that restarts uvicorn on 127.0.0.1:8001 if it died. Laravel
# already points at it via ANALYTICS_SERVICE_URL. Idempotent; safe to
# re-run after dependency changes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "setup" to provision the analytics service'
        required: true

concurrency:
  group: charts-production-deploy
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'setup' }}
        run: |
          echo '::error::Confirmation input was not "setup" -- aborting.'
          exit 1
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Provision
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'SETUP'
          set -euo pipefail
          AN="$DEPLOY_PATH/analytics"
          PY=/opt/alt/python312/bin/python3.12
          [ -x "$PY" ] || PY=/opt/alt/python313/bin/python3.13
          echo "== python: $($PY --version)"
          cd "$AN"

          echo "== prior uvicorn log (crash evidence from earlier attempts)"
          tail -25 uvicorn.log 2>/dev/null || echo "no uvicorn.log"
          echo "== limits"
          ulimit -v; ulimit -u
          echo "== staged import probe (finds the memory killer)"
          for mod in fastapi pandas numpy sklearn statsmodels backtrader numba vectorbt main; do
            r=$(timeout 90 ./.venv/bin/python -X faulthandler -c "import $mod" 2>&1 | tail -2)
            echo "import $mod -> ${r:-OK}"
          done || true

          # pandas-ta's current releases need >=3.12: recreate a stale venv
          if [ -d .venv ] && ! ./.venv/bin/python --version 2>/dev/null | grep -q "3\.1[23]"; then
            rm -rf .venv
          fi
          if [ ! -d .venv ]; then
            "$PY" -m venv .venv
          fi
          ./.venv/bin/pip install --upgrade --quiet pip wheel setuptools
          echo "== installing requirements (this is the heavy step)"
          ./.venv/bin/pip install --no-cache-dir --quiet -r requirements.txt
          # Repair any numpy damage from earlier cohabitation attempts: the
          # analytics stack is built against numpy 2; force a clean install
          # of whatever requirements.txt resolves to.
          ./.venv/bin/pip install --no-cache-dir --quiet --force-reinstall --no-deps numpy
          echo "== OCR venv (separate: rapidocr pins numpy<2)"
          if [ ! -x .venv-ocr/bin/python ]; then
            "$PY" -m venv .venv-ocr
          fi
          ./.venv-ocr/bin/pip install --no-cache-dir --quiet --upgrade pip
          ./.venv-ocr/bin/pip install --no-cache-dir --quiet -r requirements-ocr.txt
          # vectorbt (0.2x) registers plotly 'scattermapbox' templates that
          # plotly >=6 removed - import explodes without this pin
          ./.venv/bin/pip install --no-cache-dir --quiet 'plotly<6.0'
          echo "== install done: $(./.venv/bin/pip list 2>/dev/null | wc -l) packages"
          echo "== re-probe vectorbt + main after plotly pin"
          ( timeout 90 ./.venv/bin/python -c "import vectorbt; print('vectorbt OK')" 2>&1 | tail -2 ) || true
          ( timeout 120 ./.venv/bin/python -c "import main; print('main OK')" 2>&1 | tail -3 ) || true
          set -x

          cat > run.sh <<'RUN'
          #!/bin/bash
          # Keepalive-managed launcher for the analytics service.
          # Start-if-dead ONLY - the 5-minute cron runs this; it must never
          # kill a healthy process. Restarts for new code happen in the
          # setup workflow itself, below.
          cd "$(dirname "$0")"
          if ! pgrep -u "$(id -un)" -f "uvicorn main:app" >/dev/null; then
            nohup ./.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8001 \
              >> uvicorn.log 2>&1 &
            echo "$(date -u +%FT%TZ) started" >> keepalive.log
          fi
          RUN
          chmod +x run.sh

          # Idempotent crontab entries (temp file - a grep with zero
          # surviving lines must not kill the script under set -e/pipefail)
          ( crontab -l 2>/dev/null || true ) > cron.old
          grep -v "charts-analytics-keepalive" cron.old > cron.new || true
          echo "*/5 * * * * $AN/run.sh # charts-analytics-keepalive" >> cron.new
          echo "@reboot $AN/run.sh # charts-analytics-keepalive" >> cron.new
          crontab cron.new
          rm -f cron.old cron.new
          echo "== cron installed"

          echo "== import smoke test (surfaces startup crashes)"
          timeout 60 ./.venv/bin/python -c "import main; print('main imports OK')" 2>&1 | tail -15 || true
          echo "== last uvicorn log lines"
          tail -20 uvicorn.log 2>/dev/null || echo "no uvicorn.log yet"

          # Deliberate restart: this workflow ships new code/deps, and a
          # surviving old process would keep serving the previous build.
          pkill -u "$(id -un)" -f "uvicorn main:app" || true
          sleep 2
          ./run.sh
          echo "== waiting for the service to bind (heavy imports take ~30s)"
          for i in $(seq 1 30); do
            curl -sf -m 3 http://127.0.0.1:8001/health >/dev/null && break
            sleep 3
          done
          curl -sf -m 5 http://127.0.0.1:8001/health || { echo "service never came up"; tail -20 uvicorn.log; exit 1; }
          echo "== process: $(pgrep -u "$(id -un)" -f 'uvicorn main:app' | head -1 || echo NOT RUNNING)"
          echo "== memory budget (cgroup limit vs uvicorn RSS)"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "no cgroup file"
          ps -o rss= -p "$(pgrep -u "$(id -un)" -f 'uvicorn main:app' | head -1)" | awk '{print "uvicorn RSS: " $1/1024 " MB"}'
          echo "== standalone OCR worker probe (subprocess memory profile)"
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > /tmp/ocrprobe.png
          time ./.venv-ocr/bin/python analysis/ocr_cli.py /tmp/ocrprobe.png | tail -1
          ./.venv/bin/python -c "import numpy; print('main venv numpy OK:', numpy.__version__)"
          echo "== OCR endpoint probe (tiny white png - engine load + inference)"
          PNG_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          curl -s -m 90 -X POST http://127.0.0.1:8001/ocr-symbol \
            -H 'Content-Type: application/json' \
            -d "{\"image_b64\": \"$PNG_B64\"}" -w "\nocr-symbol: HTTP %{http_code}\n" | tail -3
          echo "== local probe:"
          curl -s -o /dev/null -w "docs: %{http_code}\n" http://127.0.0.1:8001/docs || true
          curl -s -X POST http://127.0.0.1:8001/validate-rule \
            -H 'Content-Type: application/json' \
            -d '{"rule":{"entry":{"all":[{"indicator":"rsi","period":14,"op":"lt","value":30}]},"exit":{"all":[{"indicator":"rsi","period":14,"op":"gt","value":70}]}}}' \
            -w "\nvalidate-rule: %{http_code}\n" | tail -2 || true
          SETUP
