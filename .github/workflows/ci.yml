name: CI

# Runs on every pull request and push to main. One required check, "Quality
# gate (all checks must pass)", sums it up. Mirrors the sibling repos' CI
# (Dot.Engage and others) adapted to Charts' three parts.
#
# What gates:
#   backend    Laravel 12 PHPUnit suite (SQLite in memory, per phpunit.xml;
#              no real or shared database is ever touched) and composer
#              validate.
#   analytics  the FastAPI/backtesting engine's pytest suite (Python 3.12,
#              the version the server runs).
#   frontend   the Vite build of the plain HTML/CSS/JS frontend.
#
# What only informs (continue-on-error, never blocks):
#   audit      composer audit, npm audit (frontend + backend/), pip-audit.
#              New advisories appear without anyone touching the code, so
#              blocking on them would turn every run red until cleared.
#   pint       Laravel Pint code style. The existing code base has never
#              been formatted with it, so it reports many files today. Move
#              it into the gate's needs after a one-off `pint` formatting PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; every other
# event gets its own group so a run on main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, bcmath, gd, zip, xml, fileinfo, sodium

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: composer.json and composer.lock agree
        run: composer validate --no-check-publish

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests in the owner-machine group need the real, gitignored DKP signing
      # key (server / owner machine only), so CI excludes them. Owner decision.
      - name: Tests
        run: php artisan test --compact --exclude-group=owner-machine

  analytics:
    name: Analytics tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

  pint:
    name: Code style (Pint, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, bcmath, gd, zip, xml, fileinfo, sodium
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pint
        run: vendor/bin/pint --test

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Composer audit
        working-directory: backend
        continue-on-error: true
        run: composer audit --locked --no-interaction || echo "::warning::composer audit reports advisories (not blocking)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit (frontend)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=moderate || echo "::warning::npm audit reports advisories in frontend/ (not blocking)"

      - name: npm audit (backend asset tooling)
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=moderate || echo "::warning::npm audit reports advisories in backend/ (not blocking)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Audits what pip would actually install from requirements.txt
      # (unpinned ranges, so the transitive set is resolved first).
      - name: pip-audit (analytics)
        working-directory: analytics
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || echo "::warning::pip-audit reports advisories (not blocking)"

  gate:
    name: Quality gate (all checks must pass)
    runs-on: ubuntu-latest
    needs: [backend, analytics, frontend]
    if: always()
    steps:
      - name: Require backend, analytics and frontend to have passed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "analytics: ${{ needs.analytics.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"
          [ "${{ needs.backend.result }}" = "success" ] \
            && [ "${{ needs.analytics.result }}" = "success" ] \
            && [ "${{ needs.frontend.result }}" = "success" ]
