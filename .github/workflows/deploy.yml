name: Deploy to Production

# Manual-only, mirroring the memory/dopemine pipeline: run from the Actions
# tab (or `gh workflow run deploy.yml -f confirm=deploy`). Builds the
# frontend on the runner, updates the repo + Laravel on the server, and
# refreshes the docroot statics. Requires the DEPLOY_* secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: charts-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to charts.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo '::error::Confirmation input was not "deploy" -- aborting.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend (same-origin API)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          VITE_API_BASE=/api npx vite build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH/backend"
          PHP=php
          echo "== Current release: $(git -C "$DEPLOY_PATH" rev-parse --short HEAD)"
          # ---- application-folder guard (tolerant: it can never fail the deploy)
          # Layout (bootstrap.yml): the docroot is ~/charts.infodot.co.za, the repo checkout $DEPLOY_PATH is
          # <docroot>/charts and the Laravel app is $DEPLOY_PATH/backend. The docroot .htaccess lets the web server
          # hand out any file that exists, so without a deny file the whole checkout is downloadable:
          # backend/.env, backend/database/database.sqlite, backend/storage/logs, backend/vendor, .git and the
          # analytics/ folder. (Four other platforms were found doing this on 2026-10-20.) This makes sure
          # $DEPLOY_PATH/.htaccess contains `Require all denied`, the same way the App Folder Guard workflow in
          # InfoDot does. It goes on the checkout, not on backend/, so .git and analytics/ are covered too. Nothing
          # in the checkout is meant to be fetched by URL: the built frontend is unpacked into the docroot, and
          # /api reaches Laravel through the docroot index.php shim, which includes backend/public/index.php as PHP.
          # The body is a subshell with `set +e`: every outcome, a failed write included, is one log line and the
          # deploy carries on. It skips itself when the checkout looks like a docroot (its parent is $HOME, or it
          # holds an index.php/index.html, or backend/ has index.php beside artisan and no public/index.php).
          # It runs BEFORE maintenance mode. The file is untracked, so `git reset --hard` leaves it alone.
          guard_app_folder() (
            set +e
            F="$DEPLOY_PATH/.htaccess"
            if [ ! -f "$DEPLOY_PATH/backend/artisan" ]; then echo "== App-folder guard: skipped (no backend/artisan in $DEPLOY_PATH)"; exit 0; fi
            PARENT="$(cd "$(dirname "$DEPLOY_PATH")" 2>/dev/null && pwd -P)"
            HOME_REAL="$(cd "${HOME:-/nonexistent}" 2>/dev/null && pwd -P)"
            if [ -z "$PARENT" ] || [ "$PARENT" = "$HOME_REAL" ]; then
              echo "== App-folder guard: skipped (the checkout is directly in the home folder or its parent is unknown; it may be the docroot)"; exit 0
            fi
            if [ -f "$DEPLOY_PATH/index.php" ] || [ -f "$DEPLOY_PATH/index.html" ] \
               || { [ -f "$DEPLOY_PATH/backend/index.php" ] && [ ! -f "$DEPLOY_PATH/backend/public/index.php" ]; }; then
              echo "== App-folder guard: skipped (index file in the checkout: this looks like a docroot)"; exit 0
            fi
            if [ -f "$F" ] && grep -q 'Require all denied' "$F"; then
              echo "== App-folder guard: already present"
            elif [ -f "$F" ]; then
              if cp "$F" "$F.before-guard" && printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$F"; then
                echo "== App-folder guard: appended to the existing .htaccess (original kept as .htaccess.before-guard)"
              else
                echo "::warning::App-folder guard: could not append to $F (deploy continues)"
              fi
            else
              if printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$F"; then
                echo "== App-folder guard: written (new .htaccess)"
              else
                echo "::warning::App-folder guard: could not write $F (deploy continues)"
              fi
            fi
            exit 0
          )
          guard_app_folder || true

          git -C "$DEPLOY_PATH" fetch origin main
          $PHP artisan down --retry=30 || true
          git -C "$DEPLOY_PATH" reset --hard origin/main
          composer install --no-interaction --optimize-autoloader --no-dev
          $PHP artisan migrate --force
          $PHP artisan config:cache
          $PHP artisan route:cache
          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-charts"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=1
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH/backend && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (InfoDot docs/programme R-1): when the account runs the bounded-concurrency cron runner
          # (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron and the
          # runner starts them, at most 4 at a time, away from second 0. Its own crontab lines are removed (a migration
          # on deploy). Without the runner the lines above are installed as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          $PHP artisan up
          echo "== Deployed: $(git -C "$DEPLOY_PATH" rev-parse --short HEAD)"
          DEPLOY

      - name: Upload built frontend to docroot
        run: |
          DOCROOT_PARENT="$(dirname "${{ secrets.DEPLOY_PATH }}")"
          tar -C frontend/dist -czf frontend.tgz .
          scp -i ~/.ssh/deploy_key frontend.tgz \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DOCROOT_PARENT/frontend.tgz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '$DOCROOT_PARENT' && tar -xzf frontend.tgz && rm frontend.tgz"

      # Security headers for the static frontend (R-22 Priority 5.2). The docroot already has an .htaccess, written once
      # by bootstrap.yml: DirectoryIndex plus the rule that hands everything that is not a file to the index.php shim,
      # and possibly lines the host added since. Shipping a whole new .htaccess with the frontend would replace it and
      # could take /api down, so the headers are SPLICED in instead: the block between the two marker lines of
      # frontend/security-headers.htaccess replaces the old copy of itself (or is appended on the first run) and every
      # other line is left exactly as it is. The previous file is kept once as .htaccess.before-headers. This step can
      # never fail the deploy: a problem is a warning. The same values are sent by the Laravel middleware.
      - name: Apply security headers to the docroot .htaccess
        run: |
          DOCROOT_PARENT="$(dirname "${{ secrets.DEPLOY_PATH }}")"
          scp -i ~/.ssh/deploy_key frontend/security-headers.htaccess \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DOCROOT_PARENT/.security-headers.new" \
            || { echo "::warning::could not upload the security-headers block (deploy continues, headers unchanged)"; exit 0; }
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DOCROOT="$DOCROOT_PARENT" 'bash -s' <<'APPLY' || echo "::warning::the security-headers step failed on the server (deploy continues)"
          set +e
          cd "$DOCROOT" || { echo "::warning::docroot $DOCROOT not found; headers not applied"; exit 0; }
          NEW=.security-headers.new
          HT=.htaccess
          BEGIN='# BEGIN dot-security-headers'
          END='# END dot-security-headers'
          if ! grep -qxF "$BEGIN" "$NEW" || ! grep -qxF "$END" "$NEW"; then
            echo "::warning::the uploaded block has no BEGIN/END markers; headers not applied"; rm -f "$NEW"; exit 0
          fi
          if [ ! -f "$HT" ]; then
            echo "::warning::no $HT in the docroot (has bootstrap.yml run?); headers not applied"; rm -f "$NEW"; exit 0
          fi
          if grep -qxF "$BEGIN" "$HT" && ! grep -qxF "$END" "$HT"; then
            echo "::warning::$HT has a BEGIN marker but no END marker; left untouched"; rm -f "$NEW"; exit 0
          fi
          [ -f "$HT.before-headers" ] || cp -p "$HT" "$HT.before-headers"
          # Old copy of the block out (and trailing blank lines, so they do not pile up), fresh block in at the end.
          awk -v b="$BEGIN" -v e="$END" '$0==b{s=1;next} $0==e{s=0;next} !s{l[++n]=$0} END{while(n>0&&l[n]=="")n--; for(i=1;i<=n;i++)print l[i]}' "$HT" > "$HT.tmp" \
            && { cat "$HT.tmp"; printf '\n'; cat "$NEW"; } > "$HT.merged" \
            && { chmod --reference="$HT" "$HT.merged" 2>/dev/null || chmod 644 "$HT.merged"; } \
            && mv "$HT.merged" "$HT" \
            && echo "== docroot .htaccess: security-headers block applied" \
            || echo "::warning::could not splice the security-headers block into $HT (left as it was)"
          rm -f "$HT.tmp" "$HT.merged" "$NEW"
          APPLY
          sleep 3
          HEADERS="$(curl -s -I -m 20 https://charts.infodot.co.za/ || true)"
          for NAME in x-content-type-options x-frame-options referrer-policy permissions-policy strict-transport-security content-security-policy-report-only; do
            if printf '%s' "$HEADERS" | grep -qi "^$NAME:"; then echo "== header on /: $NAME present"; else echo "::warning::header $NAME not seen on /"; fi
          done

      - name: Verify
        run: |
          sleep 3
          curl -s -o /dev/null -w "/: %{http_code}\n" https://charts.infodot.co.za/
          curl -s -o /dev/null -w "/api POST backtests: %{http_code}\n" -X POST https://charts.infodot.co.za/api/backtests

      # The application folder must not answer over HTTP. Public requests only (no SSH, nothing is read), after
      # `php artisan up`, so it can only turn a finished run red, never leave the site down. 200 is a leak;
      # 301/302/403/404 are fine. The Laravel app is <docroot>/charts/backend, so the nine usual paths are asked
      # for under /<checkout>/backend/; /<checkout>/.git/HEAD is added because the whole checkout sits in the docroot.
      # Only status codes are printed.
      - name: Probe the application folder from outside
        if: ${{ !cancelled() }}
        env:
          SITE_URL: https://charts.infodot.co.za
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          KEY="$(basename "$DEPLOY_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNREACHED=0
          for P in backend/.env backend/.env.bak-secrets backend/artisan backend/composer.json backend/composer.lock backend/database/database.sqlite backend/storage/logs/laravel.log backend/vendor/autoload.php backend/phpunit.xml .git/HEAD; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            case "$CODE" in
              200) echo "::error::EXPOSED /$KEY/$P answered 200"; EXPOSED=1 ;;
              000|"") echo "000 /$KEY/$P (no answer)"; UNREACHED=$((UNREACHED + 1)) ;;
              *) echo "$CODE /$KEY/$P" ;;
            esac
          done
          [ "$UNREACHED" -eq 0 ] || echo "::warning::$UNREACHED probe request(s) got no answer; those paths are unverified."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::The application folder is readable over HTTP (database, logs, vendor/ or .git may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive path answered 200 ($((10 - UNREACHED)) of 10 paths verified)."
