<!DOCTYPE html>
<html lang="en" class="dot-roboto">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — Strategy Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<div id="app-header" data-page="strategy"></div>
<main class="container" id="main" tabindex="-1">
<div class="page-head">
  <h1>Strategy Builder</h1>
  <p class="sub">Compose entry and exit rules from indicators, test them on real data, save what survives.</p>
</div>

  <div class="card">
    <label for="loadSelect">Load from saved</label>
    <select id="loadSelect">
      <option value="">— start from scratch —</option>
    </select>

    <div class="panels mt-20">
      <div class="panel">
        <div class="panel-header">
          <h3>Entry</h3>
          <select id="entryCombinator" aria-label="Entry conditions combine with">
            <option value="all">ALL (AND)</option>
            <option value="any">ANY (OR)</option>
          </select>
        </div>
        <div id="entryConditions"></div>
        <button type="button" class="secondary add-condition-btn" id="addEntryCondition">+ Add Condition</button>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h3>Exit</h3>
          <select id="exitCombinator" aria-label="Exit conditions combine with">
            <option value="all">ALL (AND)</option>
            <option value="any">ANY (OR)</option>
          </select>
        </div>
        <div id="exitConditions"></div>
        <button type="button" class="secondary add-condition-btn" id="addExitCondition">+ Add Condition</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="flush">Test Run</h3>
    <div class="row">
      <div>
        <label for="symbol">Symbol</label>
        <input id="symbol" placeholder="AAPL or BTC/USDT" value="AAPL" />
      </div>
      <div>
        <label for="assetClass">Asset class</label>
        <select id="assetClass">
          <option value="equity">Equity</option>
          <option value="crypto">Crypto</option>
          <option value="commodity">Commodity</option>
          <option value="forex">Forex</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="startDate">Start date</label>
        <input id="startDate" type="date" value="2023-01-01" />
      </div>
      <div>
        <label for="endDate">End date</label>
        <input id="endDate" type="date" value="2026-01-01" />
      </div>
    </div>
    <button id="testRunButton" class="mt-16">Test Run</button>
    <div id="error"></div>
  </div>

  <div id="results" class="card">
    <h2 id="resultTitle"></h2>
    <div class="metrics-grid">
      <div class="metric-box"><label>Total return</label><div class="value" id="mTotalReturn"></div></div>
      <div class="metric-box"><label>Win rate</label><div class="value" id="mWinRate"></div></div>
      <div class="metric-box"><label>Max drawdown</label><div class="value negative" id="mDrawdown"></div></div>
      <div class="metric-box"><label>Sharpe</label><div class="value" id="mSharpe"></div></div>
      <div class="metric-box"><label>Trades</label><div class="value" id="mTrades"></div></div>
      <div class="metric-box"><label>Losing trades</label><div class="value" id="mLosingTrades"></div></div>
    </div>
    <svg id="equityCurve"></svg>
    <div class="disclosure">
      <strong id="dConfidence"></strong>
      <div id="dAttribution"></div>
      <div id="dRisk" class="mt-8"></div>
    </div>
  </div>

  <div class="card">
    <h3 class="flush">Save Strategy</h3>
    <label for="strategyName">Name</label>
    <input id="strategyName" placeholder="My EMA Crossover" />
    <label for="strategyDescription">Description (optional)</label>
    <input id="strategyDescription" placeholder="" />
    <button id="saveButton" class="mt-16">Save Strategy</button>
    <span id="loginHint">Log in to save</span>
    <div id="saveError"></div>
  </div>
</main>
<script type="module" src="/src/strategy-builder.js"></script>
</body>
</html>
