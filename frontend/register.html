<!DOCTYPE html>
<html lang="en" class="dot-roboto">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<main class="container narrow" id="main">
  <div class="auth-head">
    <a href="/" aria-label="Dot.Charts home"><img src="/images/logo.png" alt="Dot.Charts" width="150" height="113" /></a>
  </div>
  <div class="page-head centred">
    <h1>Register</h1>
  </div>
  <div class="card">
    <label for="name">Name</label>
    <input id="name" placeholder="Ada Lovelace" />
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="At least 8 characters" />
    <button id="registerButton" class="block">Create Account</button>
    <div id="error"></div>
  </div>
  <p class="switch">Already have an account? <a href="/login.html">Log In</a> &nbsp;&middot;&nbsp; <a href="/">Back to the console</a></p>
</main>
<script type="module" src="/src/register.js"></script>
</body>
</html>
