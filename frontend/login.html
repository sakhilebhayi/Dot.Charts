<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<div class="container narrow">
  <div class="auth-head">
    <a href="/" aria-label="Dot.Charts home"><img src="/images/logo.png" alt="Dot.Charts" /></a>
  </div>
  <div class="page-head" style="text-align:center">
    <h1>Log In</h1>
  </div>
  <div class="card">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" />
    <button id="loginButton" style="width:100%">Log In</button>
    <div id="error"></div>
  </div>
  <p class="switch">No account? <a href="/register.html">Register</a> &nbsp;&middot;&nbsp; <a href="/">Back to the console</a></p>
</div>
<script type="module" src="/src/login.js"></script>
</body>
</html>
