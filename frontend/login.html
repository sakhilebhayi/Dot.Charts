<!DOCTYPE html>
<html lang="en" class="dot-roboto">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<main class="container narrow" id="main">
  <div class="auth-head">
    <a href="/" aria-label="Dot.Charts home"><img src="/images/logo.png" alt="Dot.Charts" /></a>
  </div>
  <div class="page-head centred">
    <h1>Log In</h1>
  </div>
  <div class="card">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" />
    <button id="loginButton" class="block">Log In</button>
    <div id="error"></div>
  </div>
  <p class="switch">No account? <a href="/register.html">Register</a> &nbsp;&middot;&nbsp; <a href="/">Back to the console</a></p>
</main>
<script type="module" src="/src/login.js"></script>
</body>
</html>
