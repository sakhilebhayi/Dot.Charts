<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<div class="container">
<header class="bar">
  <a href="/" aria-label="Dot.Charts home"><img src="/images/logo.png" alt="Dot.Charts" class="bar-logo" /></a>
  <nav>
    <a href="/backtest.html">Backtest</a>
    <a href="/strategy-builder.html">Strategy Builder</a>
    <a href="/history.html" aria-current="page">History</a>
    <a href="/journal.html">Journal</a>
    <a href="/options.html">Options Vol</a>
    <span id="authState"></span>
  </nav>
</header>
<div class="page-head">
  <h1>Backtest History</h1>
  <p class="sub">Your past runs. Login required &mdash; this list is always scoped to your own account.</p>
</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="filterStrategy">Strategy</label>
        <select id="filterStrategy">
          <option value="">All</option>
          <option value="ma_crossover">MA Crossover</option>
          <option value="rsi_mean_reversion">RSI Mean-Reversion</option>
          <option value="breakout">Breakout (Donchian)</option>
          <option value="bollinger_mean_reversion">Bollinger Mean-Reversion</option>
          <option value="momentum">Momentum</option>
          <option value="pairs_trading">Pairs Trading (Stat-Arb)</option>
          <option value="ml_signal">ML Signal (Explainable)</option>
          <option value="method_714">714 Method</option>
          <option value="custom">Custom Strategy</option>
        </select>
      </div>
      <div>
        <label for="filterAssetClass">Asset class</label>
        <select id="filterAssetClass">
          <option value="">All</option>
          <option value="equity">Equity</option>
          <option value="crypto">Crypto</option>
          <option value="commodity">Commodity</option>
          <option value="forex">Forex</option>
        </select>
      </div>
      <div>
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option value="complete">Complete</option>
          <option value="failed">Failed</option>
          <option value="queued">Queued</option>
        </select>
      </div>
    </div>
  </div>

  <div id="error"></div>
  <div id="empty">No backtests match these filters yet.</div>
  <div id="runsList"></div>
  <button id="loadMore" class="secondary" style="display:none">Load more</button>

  <div id="results" class="card">
    <h2 id="resultTitle"></h2>
    <div class="metrics-grid">
      <div class="metric-box"><label>Total return</label><div class="value" id="mTotalReturn"></div></div>
      <div class="metric-box"><label>Win rate</label><div class="value" id="mWinRate"></div></div>
      <div class="metric-box"><label>Max drawdown</label><div class="value negative" id="mDrawdown"></div></div>
      <div class="metric-box"><label>Sharpe</label><div class="value" id="mSharpe"></div></div>
      <div class="metric-box"><label>Trades</label><div class="value" id="mTrades"></div></div>
      <div class="metric-box"><label>Losing trades</label><div class="value" id="mLosingTrades"></div></div>
    </div>
    <svg id="equityCurve"></svg>
    <div class="disclosure">
      <strong id="dConfidence"></strong>
      <div id="dAttribution"></div>
      <div id="dRisk" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/history.js"></script>
</body>
</html>
