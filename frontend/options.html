<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — Options Vol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<div class="container">
<header class="bar">
  <a href="/" aria-label="Dot.Charts home"><img src="/images/logo.png" alt="Dot.Charts" class="bar-logo" /></a>
  <nav>
    <a href="/backtest.html">Backtest</a>
    <a href="/strategy-builder.html">Strategy Builder</a>
    <a href="/history.html">History</a>
    <a href="/journal.html">Journal</a>
    <a href="/options.html" aria-current="page">Options Vol</a>
    <a href="/login.html">Log in</a>
  </nav>
</header>
<div class="page-head">
  <h1>Options Vol</h1>
  <p class="sub">A current-state volatility-regime read &mdash; realized-vol rank and put-call skew. Not a backtest, not a trade recommendation.</p>
</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="symbol">Symbol</label>
        <input id="symbol" placeholder="AAPL" value="AAPL" />
      </div>
      <div>
        <label for="assetClass">Asset class</label>
        <select id="assetClass">
          <option value="equity">Equity</option>
          <option value="crypto">Crypto</option>
          <option value="commodity">Commodity</option>
          <option value="forex">Forex</option>
        </select>
      </div>
    </div>

    <button id="checkButton">Check vol signal</button>
    <div id="error"></div>
  </div>

  <div id="results" class="card">
    <h2 id="resultTitle"></h2>
    <div class="metrics-grid">
      <div class="metric-box"><label>Spot</label><div class="value" id="mSpot"></div></div>
      <div class="metric-box"><label>Realized vol (annualized)</label><div class="value" id="mRealizedVol"></div></div>
      <div class="metric-box"><label>Realized-vol rank</label><div class="value" id="mVolRank"></div></div>
      <div class="metric-box"><label>Vol regime</label><div class="value" id="mVolRegime"></div></div>
      <div class="metric-box"><label>Put-call skew</label><div class="value" id="mSkew"></div></div>
      <div class="metric-box"><label>Skew regime</label><div class="value" id="mSkewRegime"></div></div>
    </div>
    <div class="disclosure">
      <strong>Disclosure</strong>
      <div id="dAttribution"></div>
      <div id="dRisk" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/options.js"></script>
</body>
</html>
