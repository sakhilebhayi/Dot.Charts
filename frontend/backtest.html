<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dot.Charts — Backtest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/instrument.css" />
</head>
<body>
<div class="container">
<header class="bar">
  <a href="/" aria-label="Dot.Charts home"><img src="/images/logo.png" alt="Dot.Charts" class="bar-logo" /></a>
  <nav>
    <a href="/backtest.html" aria-current="page">Backtest</a>
    <a href="/strategy-builder.html">Strategy Builder</a>
    <a href="/history.html">History</a>
    <a href="/journal.html">Journal</a>
    <a href="/options.html">Options Vol</a>
    <span id="authState"></span>
  </nav>
</header>
<div class="page-head">
  <h1>Backtest</h1>
  <p class="sub">Real historical data, real metrics &mdash; nine strategies from MA crossover to the 714 Method.</p>
</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="symbol">Symbol</label>
        <input id="symbol" placeholder="AAPL or BTC/USDT" value="AAPL" />
        <select id="symbolCommodity" style="display:none">
          <option value="GC=F">Gold</option>
          <option value="SI=F">Silver</option>
          <option value="CL=F">Oil (WTI)</option>
          <option value="^GDAXI">GER30 / GER40 (DAX)</option>
        </select>
        <select id="symbolForex" style="display:none">
          <option value="EURUSD=X">EUR/USD</option>
          <option value="GBPUSD=X">GBP/USD</option>
          <option value="USDJPY=X">USD/JPY</option>
          <option value="USDZAR=X">USD/ZAR</option>
        </select>
      </div>
      <div>
        <label for="assetClass">Asset class</label>
        <select id="assetClass">
          <option value="equity">Equity</option>
          <option value="crypto">Crypto</option>
          <option value="commodity">Commodity</option>
          <option value="forex">Forex</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="startDate">Start date</label>
        <input id="startDate" type="date" value="2023-01-01" />
      </div>
      <div>
        <label for="endDate">End date</label>
        <input id="endDate" type="date" value="2026-01-01" />
      </div>
    </div>
    <label for="strategy">Strategy</label>
    <select id="strategy">
      <option value="ma_crossover">MA Crossover</option>
      <option value="rsi_mean_reversion">RSI Mean-Reversion</option>
      <option value="breakout">Breakout (Donchian)</option>
      <option value="bollinger_mean_reversion">Bollinger Mean-Reversion</option>
      <option value="momentum">Momentum</option>
      <option value="pairs_trading">Pairs Trading (Stat-Arb)</option>
      <option value="ml_signal">ML Signal (Explainable)</option>
      <option value="method_714">714 Method</option>
    </select>

    <div id="symbolBRow" style="display:none">
      <label for="symbolB">Symbol B (paired against Symbol above)</label>
      <input id="symbolB" placeholder="MSFT" />
    </div>

    <button id="runButton">Run backtest</button>
    <div id="error"></div>
  </div>

  <div id="results" class="card">
    <h2 id="resultTitle"></h2>
    <div class="metrics-grid">
      <div class="metric-box"><label>Total return</label><div class="value" id="mTotalReturn"></div></div>
      <div class="metric-box"><label>Win rate</label><div class="value" id="mWinRate"></div></div>
      <div class="metric-box"><label>Max drawdown</label><div class="value negative" id="mDrawdown"></div></div>
      <div class="metric-box"><label>Sharpe</label><div class="value" id="mSharpe"></div></div>
      <div class="metric-box"><label>Trades</label><div class="value" id="mTrades"></div></div>
      <div class="metric-box"><label>Losing trades</label><div class="value" id="mLosingTrades"></div></div>
    </div>
    <svg id="equityCurve"></svg>
    <div class="disclosure">
      <strong id="dConfidence"></strong>
      <div id="dAttribution"></div>
      <div id="dRisk" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/backtest.js"></script>
</body>
</html>
